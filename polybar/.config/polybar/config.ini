[colors]
background = #cc1f1a14
background-alt = #3a2f24
foreground = #e6dcc8
primary = #8fa66a
alert = #c8553d
disabled = #7a6e5c

[bar/main]
width = 100%
height = 18pt
radius = 0
bottom = false
background = #cc1f1a14
foreground = #e6dcc8
line-size = 2pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = JetBrains Mono:size=9;2
font-1 = Font Awesome 7 Free:style=Solid:size=9;2
font-2 = Font Awesome 7 Brands:style=Regular:size=9;2
modules-left = i3 xwindow
modules-center = date
modules-right = pulseaudio eth cpu memory
cursor-click = pointer
enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 1
label-unfocused = %index%
label-unfocused-padding = 1
label-visible = %index%
label-visible-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted = " muted"
label-muted-foreground = ${colors.disabled}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %essid%
label-disconnected = 

[module/eth]
type = internal/network
interface-type = wired
interval = 3
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%
label-disconnected = 
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%%

[module/date]
type = internal/date
interval = 1
date = %a %d %b  %H:%M
label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
