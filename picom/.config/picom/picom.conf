# ---------- Backend ----------
backend = "glx";
vsync = true;

# ---------- Rounded corners ----------
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---------- Shadows ----------
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# ---------- Fading ----------
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# ---------- Transparency ----------
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

# ---------- General ----------
detect-rounded-corners = true;
use-damage = true;
log-level = "warn";
